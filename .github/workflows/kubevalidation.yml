name: Kubernetes Manifest Schema Validator (Kubeconform)

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - k8sValidate-test/**
      - candidate/**

jobs:
  validate_manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for accurate diffing

      - name: Identify Modified Kubernetes Manifest Files
        id: files
        run: |
          # Use git diff to find only the new or modified .yml files in the push
          files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '\.y[a]*ml$' | grep -E '(k8s/|lvl1/|lvl2/|lvl3/)' || true)
          
          if [ -z "$files" ]; then
            echo "::notice::Skipping validation: No Kubernetes manifest files modified in this push."
            echo "skip_validation=true" >> $GITHUB_OUTPUT
          else
            echo "k8s_files=$files" >> $GITHUB_OUTPUT
          fi
          
      - name: Run Kubeconform Validation
        # Runs only if there are files to validate
        if: steps.files.outputs.skip_validation != 'true'
        uses: marketplace/kubeconform-action@v1
        id: kubeconform
        with:
          input: ${{ steps.files.outputs.k8s_files }}
          kubernetes_version: '1.29.0'
          # Fail the job if validation errors are found
          strict: true
          
      - name: Create Success Comment on Commit
        # Runs if the entire job succeeded (files were checked and passed)
        if: success() && steps.files.outputs.skip_validation != 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ✅ **Kubernetes Manifest Validation Success**
            All modified manifests passed the manifest analisys. The file syntax is correct and conforms to the cluster schema.
          number: ${{ github.sha }}
          header: 'k8s-validation-summary'
          
      - name: Create Failure Comment on Commit
        # Runs if the job failed when files contains errors
        if: failure() && steps.files.outputs.skip_validation != 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🚨 **Kubernetes Manifest Validation Failed**
            The GitHub Action failed due to errors found during K8s manifest analysis with Kubeconform.
            
            Please check the **`Run Kubeconform Schema Validation`** step output in the workflow logs for details on:
            1.  **YAML Syntax Errors**
            2.  **Kubernetes Schema Errors** (e.g., misspelled field names, invalid resource kind, or missing required fields).
          number: ${{ github.sha }}
          header: 'k8s-validation-summary'